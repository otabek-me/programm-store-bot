# fly.toml app configuration file generated for programm-store-bot on 2026-10-20T18:19:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'programm-store-bot'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[processes]
  app = 'python bot.py'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
